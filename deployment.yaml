apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywebdeployment
spec:
  replicas: 6
  selector:
    matchLabels:
      app: myweb
  template:
    metadata:
      labels:
        app: myweb
    spec:
      containers:
      - name: mywebapp
        image: sanikapatil30/myimage
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mywebdeployment
spec:
  type: NodePort
  selector:
    app: myweb
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 32714
